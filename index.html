  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wire Drawing Drafting Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { margin-top: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    input { width: 80px; }
  #draftingChart {
  height: 600px !important;
  max-height: 600px;
}

  
  
  
  
  </style>
</head>
<body>
  <h1>🧵 Wire Drawing Drafting Calculator</h1>
  <p>Start from D₀ = 5.6. Enter D₁ and Die Angle (°) for each pass:</p>

  <form id="draftingForm">
    <table>
      <thead>
        <tr>
          <th>Pass</th>
          <th>D₁ [mm]</th>
          <th>Die Angle (°)</th>
        </tr>
      </thead>
      <tbody id="inputRows"></tbody>
    </table>
    <br />
    <button type="submit">Calculate & Plot</button>
  </form>

  <div id="results" style="display:none;">
    <h2>📋 Drafting Table</h2>
    <div class="container">
      <table id="resultTable"></table>
    </div>

    <h2>📊 Graph: Area Reduction & Delta Factor</h2>
    <canvas id="draftingChart"></canvas>

  </di>

  <script>
    const numPasses = 11;
    const startingD0 = 5.6;
    const tbody = document.getElementById("inputRows");

    for (let i = 0; i < numPasses; i++) {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${i + 1}</td>
        <td><input type="number" step="0.01" name="d1_${i}" value="" required /></td>
        <td><input type="number" step="0.1" name="angle_${i}" value="11.0" min="0" max="20" required /></td>
      `;
      tbody.appendChild(row);
    }

    function calcReduction(d0, d1) {
      return (1 - Math.pow(d1 / d0, 2)) * 100;
    }

    function getAlphaRad(deg) {
      const lookup = { 3.5: 0.0611, 4.0: 0.0698, 4.5: 0.0785, 5.0: 0.0873, 5.5: 0.0960 };
      const key = (deg / 2).toFixed(1);
      return lookup[key] || (deg / 2 * Math.PI / 180);
    }

    function calcDelta(d0, d1, angle) {
      if (d0 === d1) return 0;
      const alpha = getAlphaRad(angle);
      return ((d0 + d1) / (d0 - d1)) * Math.sin(alpha);
    }

    let chartInstance = null;

    document.getElementById("draftingForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const form = new FormData(e.target);
      const data = [];
      let currentD0 = startingD0;

      for (let i = 0; i < numPasses; i++) {
        const d1 = parseFloat(form.get(`d1_${i}`));
        const angle = parseFloat(form.get(`angle_${i}`));

        const reduction = calcReduction(currentD0, d1);
        const delta = calcDelta(currentD0, d1, angle);

        data.push({ pass: i + 1, d0: currentD0.toFixed(2), d1: d1.toFixed(2), angle, reduction: reduction.toFixed(2), delta: delta.toFixed(2) });
        currentD0 = d1;
      }

      document.getElementById("results").style.display = "block";

      const table = document.getElementById("resultTable");
      table.innerHTML = "<tr><th>Pass</th><th>D0 [mm]</th><th>D1 [mm]</th><th>Die Angle (°)</th><th>Area Reduction (%)</th><th>Delta Factor</th></tr>";
      data.forEach(row => {
        table.innerHTML += `<tr><td>${row.pass}</td><td>${row.d0}</td><td>${row.d1}</td><td>${row.angle}</td><td>${row.reduction}</td><td>${row.delta}</td></tr>`;
      });

      const ctx = document.getElementById("draftingChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(r => `Pass ${r.pass}`),
          datasets: [
            {
              label: "Area Reduction (%)",
              data: data.map(r => r.reduction),
              borderColor: "blue",
              yAxisID: 'y1',
              fill: false
            },
            {
              label: "Delta Factor",
              data: data.map(r => r.delta),
              borderColor: "red",
              borderDash: [5, 5],
              yAxisID: 'y2',
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          stacked: false,
          plugins: {
            title: { display: true, text: 'Wire Drawing: Area Reduction & Delta Factor per Pass' }
          },
          scales: {
            y1: {
              type: 'linear', position: 'left', title: { display: true, text: 'Area Reduction (%)' }
            },
            y2: {
              type: 'linear', position: 'right', title: { display: true, text: 'Delta Factor' },
              grid: { drawOnChartArea: false }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
